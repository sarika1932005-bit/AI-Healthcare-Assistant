services:
  - type: web
    name: healthcare-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && pip install -r requirements-ml.txt && pip install -r requirements-image.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
